<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<!-- PWA (generated by @vite-pwa/sveltekit, which can't inject these itself under Kit 3) -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<script src="/registerSW.js" defer></script>
		<!-- Hint where we get fonts from. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Material Icons and Roboto fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Roboto:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
